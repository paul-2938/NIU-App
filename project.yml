name: NIUCustomApp
options:
  bundleIdPrefix: com.demo
targets:
  NIUCustomApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [NIUCustomApp]
    settings:
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.demo.NIUCustomApp
      INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "This app needs Bluetooth to connect to your NIU scooter."
      INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "This app needs Bluetooth to connect to your NIU scooter."
      INFOPLIST_KEY_UILaunchStoryboardName: "LaunchScreen"
      INFOPLIST_KEY_UIApplicationSceneManifest:
        UIApplicationSupportsMultipleScenes: false
        UISceneConfigurations: {}
